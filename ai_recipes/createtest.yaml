title: Create test
description: Create a test for a given model
prompt: |
 Help the user to add tests, given the dbt model {{ model }}, described on the schema file located on "{{ schema_file }}" .
 The test should validate the following:
  - If there is an ID column, it should be not null and unique
  - Other columns should be not null
 The schema file should be updated with the new tests and the tests should be run.
parameters:
  - key: model
    description: The model to create a test for
    type: string
    input_type: string
    requirement: required
  - key: schema_file
    description: The schema file that should be changed
    type: string
    input_type: string
    requirement: required
extensions:
  - type: stdio
    name: dbt-mcp-server
    cmd: /opt/homebrew/bin/uvx
    args: [
      "--env-file",
      "/Users/danieldias/Development/Repositories/sandbox/dbt-mcp/.env",
      "dbt-mcp"
    ]  
    timeout: 300
    description: "dbt Data for pokemon database"
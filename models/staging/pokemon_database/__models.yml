version: 2

models:
  # Abilities
  - name: stg_pokemon_database__abilities
    description: Pokemon abilities data with basic cleaning and transformation applied, one row per ability.
    columns:
      - name: ID
        description: The unique key for each ability.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the ability.
        tests:
          - not_null
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) where this ability was first introduced.
        tests:
          - not_null
      - name: RELEASE
        description: The game release (Diamond & Pearl, Sword & Shield, etc.) where this ability was first introduced.
        tests:
          - not_null

  # Egg Groups
  - name: stg_pokemon_database__egg_groups
    description: Pokemon egg groups data with basic cleaning and transformation applied, one row per egg group.
    columns:
      - name: ID
        description: The unique key for each egg group.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the egg group.
        tests:
          - not_null

  # Games
  - name: stg_pokemon_database__games
    description: Pokemon games data with basic cleaning and transformation applied, one row per game.
    columns:
      - name: ID
        description: The unique key for each game.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of each game.
        tests:
          - not_null
      - name: RELEASE
        description: The game release (Diamond & Pearl, Sword & Shield, etc.) where this game was first released.
        tests:
          - not_null

  # Items
  - name: stg_pokemon_database__items
    description: Items data with basic cleaning and transformation applied, one row per item.
    columns:
      - name: ID
        description: The unique key for each item.
        tests:
          - not_null
          - unique  
      - name: NAME
        description: The name of the item.
        tests:
          - not_null
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) where this item was first introduced.
        tests:
          - not_null
      - name: RELEASE
        description: The game release (Diamond & Pearl, Sword & Shield, etc.) where this item was first introduced.
        tests:
          - not_null
      - name: COST
        description: The cost of the item in the game.
        tests:
          - not_null
  
  # Locations
  - name: stg_pokemon_database__locations
    description: Locations data with basic cleaning and transformation applied, one row per location.
    columns:
      - name: ID
        description: The unique key for each location.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the location.
        tests:
          - not_null  
      - name: REGION
        description: The region (Kanto, Johto, etc.) where this location is located.
        tests:
          - not_null
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) where this location was first introduced.
        tests:
          - not_null
      - name: RELEASE
        description: The game release (Diamond & Pearl, Sword & Shield, etc.) where this location was first introduced.
          
  # Moves
  - name: stg_pokemon_database__moves
    description: Moves data with basic cleaning and transformation applied, one row per move.
    columns:
      - name: ID
        description: The unique key for each move.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the move.
        tests:
          - not_null  
      - name: TYPE
        description: The type of the move.
        tests:
          - not_null
      - name: CATEGORY 
        description: The category of the move.
      - name: POWER
        description: The power of the move.
      - name: ACCURACY
        description: The accuracy of the move.
      - name: PP
        description: The power points of the move.
      - name: PRIORITY
        description: The priority of the move in a battle.
        tests:
          - not_null

  # Pokemon Forms
  - name: stg_pokemon_database__pokemon_forms
    description: Represents a Pokemon specific form (e.g. Normal, Mega, etc.) data with basic cleaning and transformation applied, one row per form.
    columns:
      - name: ID
        description: The unique key for each pokemon.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the pokemon form.
        tests:
          - not_null
      - name: FORM_ID
        description: The form ID of the pokemon.
      - name: FORM_NAME
        description: The name of the pokemon.
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) where this form was first introduced.
        tests:
          - not_null
      - name: RELEASE
        description: The game release (Diamond & Pearl, Sword & Shield, etc.) where this form was first introduced.
        tests:
          - not_null
      - name: TYPE_1
        description: The first type of the form.
        tests:
          - not_null
      - name: TYPE_2
        description: The second type of the form.
      - name: STATS
        description: The stats of the form.
      - name: SPECIES
        description: The species of the form.
      - name: HEIGHT
        description: The height of the form.
        tests:
          - not_null
      - name: WEIGHT
        description: The weight of the form.
        tests:
          - not_null
      - name: GENDER
        description: The gender of the form.
        tests:
          - not_null
      - name: CATCH_RATE
        description: The catch rate of the form.
      - name: BASE_EXP
        description: The base experience of the form.
      - name: EGG_CYCLES
        description: The egg cycles of the form.
      - name: FRIENDSHIP
        description: The friendship of the form.
      - name: GROWTH_RATE
        description: The growth rate of the form.
        tests:
          - not_null
      - name: EV_YIELD
        description: The EV yield of the form.
        tests:
          - not_null 
        
  # Pokemons
  - name: stg_pokemon_database__pokemons
    description: Represents a Pokemon data with basic cleaning and transformation applied, one row per pokemon.
    columns:
      - name: ID
        description: The unique key for each pokemon.
        tests:
          - not_null
          - unique
      - name: NATIONAL_ID
        description: The national ID of the pokemon.
      - name: NAME
        description: The name of the pokemon.
        tests:
          - not_null
          - unique
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) where this pokemon was first introduced.
        tests:
          - not_null
        
  # Releases
  - name: stg_pokemon_database__releases
    description: Represents a game release data with basic cleaning and transformation applied, one row per release.
    columns:
      - name: ID
        description: The unique key for each release.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the release.
        tests:
          - not_null  
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) presented on this release.
        tests:
          - not_null
        
  # Type Charts
  - name: stg_pokemon_database__type_charts
    description: Represents a type chart data with basic cleaning and transformation applied, one row per type chart.
    columns:
      - name: ID
        description: The unique key for representing a pokemon type.
        tests:
          - not_null
          - unique
      - name: SUPER_EFFECTIVE
        description: The types that are super effective against the type.
      - name: NOT_VERY_EFFECTIVE
        description: The types that are not very effective against the type.
      - name: NO_EFFECT
        description: The types that have no effect on the type.

  # Types
  - name: stg_pokemon_database__types
    description: Represents a pokemon type data with basic cleaning and transformation applied, one row per pokemon type.
    columns:
      - name: ID
        description: The unique key for representing a pokemon type.
        tests:
          - not_null
          - unique
      - name: NAME
        description: The name of the pokemon type.
        tests:
          - not_null
      - name: GENERATION
        description: The generation (1st, 2nd, etc.) where this type was first introduced.
        tests:
          - not_null
        